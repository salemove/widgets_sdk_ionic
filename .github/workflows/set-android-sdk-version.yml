name: Update Glia Android Widgets SDK Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in semantic versioning format (i.e. 1.0.2)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: 0 # Disable Lefthook during CI runs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22.x'
          check-latest: true
          registry-url: 'https://npm.pkg.github.com'

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3

      - name: Install dependencies
        run: |-
          npm install
          cd example-app
          npm install

      - name: Create environment.ts
        run: |
          mkdir -p example-app/src/environments
          cat > example-app/src/environments/environment.ts <<'EOF'
          export const environment = {
            IONIC_API_KEY: 'fake-api-key',
            IONIC_API_SECRET: 'fake-api-secret',
            IONIC_SITE_ID: 'fake-site-id',
            IONIC_REGION: 'beta',
            IONIC_COMPANY_NAME: 'Glia Widgets Ionic',
          };
          EOF

      - name: Sync Capacitor
        run: |
          npm run build
          cd example-app
          npm run build
          npx cap sync android

      - name: Update Glia Android Widgets SDK version
        run: |-
          cd example-app/android
          ./gradlew glia-widgets-ionic:saveGliaAndroidWidgetsSdkVersion --sdkVersion=${{ github.event.inputs.version }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7.0.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: "Update Android Widgets SDK version to ${{ github.event.inputs.version }}"
          body: "This PR sets the Android Widgets SDK version to ${{ github.event.inputs.version }}."
          base: development
          branch: update-android-widgets-sdk-version-${{ github.event.inputs.version }}
          commit-message: "chore: update Android Widgets SDK version to ${{ github.event.inputs.version }}"
