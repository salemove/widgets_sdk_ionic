name: Run Tests

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22.x'
          check-latest: true
          registry-url: 'https://npm.pkg.github.com'

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3

      - name: Install dependencies
        run: |-
          npm install
          cd example-app
          npm install

      - name: Create environment.ts
        run: |
          mkdir -p example-app/src/environments
          cat > example-app/src/environments/environment.ts <<'EOF'
          export const environment = {
            IONIC_SITE_ID: 'fake-site-id',
            IONIC_REGION: 'beta',
            IONIC_COMPANY_NAME: 'Glia Widgets Ionic',
          };
          EOF

      - name: Sync Capacitor
        run: |
          npm run build
          cd example-app
          npm run build
          npx cap sync android

      - name: Run Android Build
        run: |

          cd example-app/android
          ./gradlew app:assembleDebug

  test-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22.x'
          check-latest: true
          registry-url: 'https://npm.pkg.github.com'

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94  # v1.336.0
        with:
          ruby-version: 3.2
          bundler-cache: true
          working-directory: example-app

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: '16.4'

      - name: Install dependencies
        run: |-
          npm install
          cd example-app
          npm install

      - name: Create environment.ts
        run: |
          mkdir -p example-app/src/environments
          cat > example-app/src/environments/environment.ts <<'EOF'
          export const environment = {
            IONIC_SITE_ID: 'fake-site-id',
            IONIC_REGION: 'beta',
            IONIC_COMPANY_NAME: 'Glia Widgets Ionic',
          };
          EOF

      - name: Sync Capacitor
        run: |
          npm run build
          cd example-app
          npm run build
          bundle install
          npx cap sync ios

      - name: Run iOS Build
        run: |
          cd example-app/ios/App

          # 1. Capture the full device line first (for logging and debugging)
          # Looks for iPhone + iOS 26.2(latest)
          DEVICE_LINE=$(xcrun xctrace list devices 2>&1 | awk '/iPhone/ && /\(26\.[2]/ { print $0; exit }')

          # 2. Validate that a device was actually found
          if [ -z "$DEVICE_LINE" ]; then
            echo "❌ Error: No iPhone found with iOS 26.2"
            exit 1
          fi

          # 3. Print the selected device details to the CI logs
          echo "📱 Selected Device: $DEVICE_LINE"

          # 4. Extract the UUID from the captured line
          DEVICE_ID=$(echo "$DEVICE_LINE" | awk '{ match($0, /[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}/); print substr($0, RSTART, RLENGTH) }')

          echo "✅ Using Device ID: $DEVICE_ID"

          # 5. Run the build
          xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -sdk iphonesimulator \
          -destination "id=$DEVICE_ID" \
          -showBuildTimingSummary build
